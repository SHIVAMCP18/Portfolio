<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantScript Phase Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">Quant<span>Script</span> phase viewer</div>
    <span id="fileName">no file loaded</span>
    <span id="status" class="badge neutral">–</span>
    <span id="optLevel" class="badge neutral">-O?</span>
    <div class="spacer"></div>
    <button id="openBtn" title="Open a qsc --dump-json file">Open dump…</button>
    <button id="pasteBtn" title="Paste dump JSON">Paste</button>
    <button id="demoBtn" title="Load the bundled example dumps">Load demo</button>
    <button id="themeBtn" title="Toggle dark / light theme">Theme</button>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
    <input id="fileInput2" type="file" accept=".json,application/json" hidden>
  </header>
  <div id="main">
    <nav id="sidebar"></nav>
    <main id="content"></main>
  </div>
  <div id="pasteModal">
    <div class="box">
      <h2>Paste a phase dump</h2>
      <p class="muted">Output of <span class="mono">qsc --dump-json FILE input.qs</span>.</p>
      <textarea id="pasteArea" spellcheck="false"></textarea>
      <div class="toolbar" style="justify-content:flex-end;margin-top:8px">
        <button id="pasteCancel">Cancel</button>
        <button id="pasteOk" class="primary">Load</button>
      </div>
    </div>
  </div>
  <!-- Optional bundled demo dumps (generated by `make examples`); absent = no demo. -->
  <script src="samples/samples.js"></script>
  <script src="app.js"></script>
</body>
</html>
